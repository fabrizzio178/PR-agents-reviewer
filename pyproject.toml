[project]
name = "agent-langgraph"
version = "0.1.0"
description = "LangGraph PR review agent: security + code/architecture review with human-in-the-loop, wired via GitHub Actions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.23.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.13",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "ruff>=0.16.7",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=9.1.1",
    "responses>=0.25",
    "types-requests>=2.33.0.20261006",
]

[project.scripts]
review = "agent_langgraph.entrypoints.cli:main"
eval = "agent_langgraph.entrypoints.eval:main"
visualize-graph = "agent_langgraph.entrypoints.visualize:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_langgraph"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
