name: PR Review Agent

# This repository reviewing its own pull requests, via the reusable workflow.
# pull_request, never pull_request_target: fork PRs must not run with secrets.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: ./.github/workflows/review.yml
    with:
      agent_repository: ${{ github.repository }}
      # Run the agent from the base branch, so a PR cannot change its own reviewer.
      agent_ref: ${{ github.event.pull_request.base.sha }}
      # Repository variables (Settings → Secrets and variables → Actions →
      # Variables) switch the model without touching this file.
      llm_provider: ${{ vars.LLM_PROVIDER || 'gemini' }}
      llm_model: ${{ vars.LLM_MODEL || '' }}
      llm_base_url: ${{ vars.LLM_BASE_URL || '' }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
