name: PR Review Agent

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  # Needed to post commit comments via the REST adapter.
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.18"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run review agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python -m agent_langgraph.entrypoints.github_action_entrypoint
